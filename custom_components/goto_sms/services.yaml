send_sms:
  fields:
    message:
      required: true
      example: "Temperature is {{ states('sensor.living_room_temperature') }}°F"
      selector:
        text:
          multiline: true
    target:
      required: true
      example: "+1234567890"
      selector:
        text:
    sender_id:
      required: true
      example: "+1234567890"
      selector:
        text:
    data:
      required: false
      example: '{"name": "John", "location": "kitchen"}'
      selector:
        object:
call_tts:
  fields:
    target:
      required: true
      example: "+1234567890"
      selector:
        text:
    message:
      required: true
      example: "The front door has been open for {{ states('sensor.door_open_minutes') }} minutes"
      selector:
        text:
          multiline: true
    tts_engine:
      required: false
      selector:
        text:
    language:
      required: false
      example: "en-US"
      selector:
        text:
    repeat:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    ring_timeout:
      required: false
      default: 25
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: s
          mode: box
